<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>nanoguará.ia — post Instagram 4:5 (foto 2/3 + dores)</title>
<style>
  @font-face{font-family:"Outfit";font-weight:700;src:url("file:///Users/rodri/projeto-nano-guara-ia/site/public/fonts/outfit-700.woff2") format("woff2");}
  @font-face{font-family:"Outfit";font-weight:600;src:url("file:///Users/rodri/projeto-nano-guara-ia/site/public/fonts/outfit-600.woff2") format("woff2");}
  @font-face{font-family:"Geist";font-weight:400;src:url("file:///Users/rodri/projeto-nano-guara-ia/site/public/fonts/geist-400.woff2") format("woff2");}
  @font-face{font-family:"Geist";font-weight:500;src:url("file:///Users/rodri/projeto-nano-guara-ia/site/public/fonts/geist-500.woff2") format("woff2");}

  :root{
    --bg:#123B26;
    --verde:#2E7D32;
    --guarana:#EF5A4C;
    --creme:#FDF9F0;
    --creme-muted:rgba(253,249,240,.72);

    --pad-x:84px;
    --type-tag:19px;
    --type-hook:54px;
    --type-dores:24px;
    --type-lockup:24px;
    --type-cta:28px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  .canvas{
    position:relative;
    width:1080px;height:1350px;
    background:var(--bg);
    overflow:hidden;
    font-family:"Geist",sans-serif;
    color:var(--creme);
    display:flex; flex-direction:column;
  }

  /* ---- 2/3 topo: imagem ---- */
  .foto{
    position:relative;
    width:1080px; height:900px;
    flex:none;
    overflow:hidden;
    background:#0A2318;
  }
  .foto img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:63% 38%;
    display:block;
  }
  .foto .tint{
    position:absolute; inset:0;
    background:var(--bg);
    opacity:.16;
    mix-blend-mode:color;
  }
  .foto .scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(10,35,24,.65) 0%, rgba(10,35,24,.08) 26%,
      rgba(10,35,24,0) 62%, rgba(18,59,38,.95) 100%);
  }

  .foto .tag-sobre-foto{
    position:absolute; top:56px; left:var(--pad-x);
    font:600 var(--type-tag)/1 "Outfit","Outfit-fallback",sans-serif;
    letter-spacing:.06em; text-transform:uppercase;
    color:var(--creme);
  }

  /* ---- 1/3 base: texto, dores, CTA ---- */
  .painel{
    flex:1;
    background:var(--bg);
    padding:44px var(--pad-x) 46px;
    display:flex; flex-direction:column; justify-content:center; gap:22px;
  }

  .hook{
    font:700 var(--type-hook)/1.14 "Outfit","Outfit-fallback",sans-serif;
    letter-spacing:-.01em;
    max-width:820px;
    text-wrap:balance;
  }
  .hook .acento{color:var(--guarana)}

  .dores{
    font:400 var(--type-dores)/1.5 "Geist",sans-serif;
    color:var(--creme-muted);
  }
  .dores b{color:var(--creme);font-weight:500}

  .rodape{
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }

  .lockup{display:flex; align-items:center; gap:12px}
  .lockup svg{width:34px;height:34px;display:block}
  .lockup span{font:600 var(--type-lockup)/1 "Outfit","Outfit-fallback",sans-serif}
  .lockup span b{color:var(--verde);font-weight:600}

  .cta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--guarana);
    color:var(--creme);
    font:600 var(--type-cta)/1 "Outfit","Outfit-fallback",sans-serif;
    padding:20px 36px;
    border-radius:999px;
    text-decoration:none;
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="canvas">
  <div class="foto">
    <img src="foto-consultorio-noite.jpg" alt="">
    <div class="tint"></div>
    <div class="scrim"></div>
    <div class="tag-sobre-foto">nanoguará.ia · whatsapp para clínicas</div>
  </div>

  <div class="painel">
    <h1 class="hook">Perdeu paciente por<br>não responder <span class="acento">a tempo?</span></h1>

    <p class="dores"><b>Mensagem de madrugada</b> · <b>confirmação esquecida</b> · <b>recepção sobrecarregada</b> — a nanoguará.ia resolve os três, sozinha, no seu WhatsApp.</p>

    <div class="rodape">
      <div class="lockup">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-hidden="true">
          <circle cx="19" cy="22" r="14" fill="#2E7D32"/>
          <circle cx="19" cy="22" r="11" fill="#D5382F"/>
          <ellipse cx="19" cy="22" rx="6.5" ry="5" fill="#FDF9F0"/>
          <ellipse cx="19" cy="22" rx="4.5" ry="3.4" fill="#17231B"/>
          <path d="M19 8 C15 2 8 3 6 7 C12 6 15 8 19 8 Z" fill="#2E7D32"/>
          <g stroke="#2E7D32" stroke-width="1.6" fill="none">
            <path d="M31 16 h4"/>
            <path d="M32 22 h6"/>
            <path d="M31 28 h4"/>
          </g>
          <circle cx="37" cy="16" r="1.6" fill="#2E7D32"/>
          <circle cx="37" cy="28" r="1.6" fill="#2E7D32"/>
        </svg>
        <span>nano<b>guará.ia</b></span>
      </div>

      <a class="cta" href="#">Link na bio <span class="seta">→</span></a>
    </div>
  </div>
</div>

</body>
</html>
