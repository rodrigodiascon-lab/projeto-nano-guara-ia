<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      guara.bot para barbearias de Manaus: story/reels 9:16, 8 s, sem narração.
      Mesma identidade das artes estáticas (docs/marketing/brand/posts/barbearias-novos-angulos).
      Área segura de stories: conteúdo entre y=250 e y=1580.
      Regras de copy: sem travessão, sem número sem fonte (horários são exemplo de uso,
      como na landing), sem promessa de resultado.
    -->
    <style>
      @font-face { font-family: Outfit; src: url(assets/outfit-700.woff2) format("woff2"); font-weight: 700; }
      @font-face { font-family: Outfit; src: url(assets/outfit-600.woff2) format("woff2"); font-weight: 600; }
      @font-face { font-family: Geist; src: url(assets/geist-400.woff2) format("woff2"); font-weight: 400; }
      @font-face { font-family: Geist; src: url(assets/geist-500.woff2) format("woff2"); font-weight: 500; }
      :root {
        --verde: #2e7d32; --verde-claro: #8fd19a; --vermelho: #d5382f; --creme: #fdf9f0;
        --grafite: #17231b; --fundo: #1d2a21; --bolha-cliente: #2c3e33;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); }
      #root, .clip, .stage { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .stage {
        color: var(--creme); font-family: Geist, sans-serif;
        background:
          radial-gradient(900px 800px at 90% 18%, rgba(46, 125, 50, .30), transparent 60%),
          radial-gradient(900px 700px at 0% 100%, rgba(213, 56, 47, .16), transparent 60%),
          var(--fundo);
        transform-origin: 50% 50%;
      }
      .selo {
        position: absolute; top: 270px; left: 84px;
        font: 600 30px/1 Outfit; letter-spacing: .22em; text-transform: uppercase;
        color: var(--verde-claro); padding-bottom: 14px; border-bottom: 4px solid var(--verde);
      }
      .titulo { position: absolute; top: 340px; left: 84px; width: 912px; font: 700 96px/1.02 Outfit; letter-spacing: -2px; }
      .titulo span { display: block; }
      .titulo .acento { color: var(--vermelho); }

      .chat { position: absolute; top: 770px; left: 84px; width: 912px; display: flex; flex-direction: column; gap: 26px; }
      .msg { max-width: 640px; padding: 24px 30px; border-radius: 32px; font: 400 40px/1.3 Geist; }
      .msg small { display: block; text-align: right; font: 400 24px/1 Geist; opacity: .7; margin-top: 10px; }
      .cli { align-self: flex-start; background: var(--bolha-cliente); border-bottom-left-radius: 8px; }
      .bot { align-self: flex-end; background: var(--verde); color: #fff; border-bottom-right-radius: 8px; }
      .ok { display: inline-flex; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #1b5e20;
            font: 700 30px/42px Outfit; justify-content: center; vertical-align: -6px; margin-left: 10px; }
      .digitando { position: absolute; right: 84px; display: flex; gap: 12px; padding: 26px 32px;
                   border-radius: 32px; border-bottom-right-radius: 8px; background: var(--verde); }
      .digitando i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, .85); }
      #dig1 { top: 920px; }
      #dig2 { top: 1220px; }
      #dig1, #dig2, #fecho, #mascoteFim, #assinatura { opacity: 0; }

      .mascote { position: absolute; width: 300px; left: 730px; top: 290px;
                 filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .45)); }

      .fecho { position: absolute; top: 640px; left: 84px; width: 912px; }
      .fecho .marca { font: 700 132px/1 Outfit; letter-spacing: -3px; }
      .fecho .marca b { color: var(--verde-claro); font-weight: 700; }
      .fecho p { font: 500 54px/1.2 Geist; margin-top: 30px; color: #dfe8e1; }
      .fecho p em { font-style: normal; color: var(--creme); }
      .mascote-fim { position: absolute; width: 560px; left: 260px; top: 1000px;
                     filter: drop-shadow(0 34px 44px rgba(0, 0, 0, .5)); }
      .assinatura { position: absolute; left: 84px; right: 84px; top: 1500px; display: flex; align-items: center;
                    justify-content: space-between; font: 500 32px/1 Geist; color: #9fb3a5; }
      .assinatura strong { font: 700 42px/1 Outfit; color: var(--creme); }
      .assinatura strong b { color: var(--verde-claro); font-weight: 700; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <section id="cena" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="stage" id="camera" data-layout-allow-overflow>
          <span class="selo" id="selo">Para barbearias</span>
          <h1 class="titulo" id="titulo">
            <span id="t1">Tem cliente</span>
            <span id="t2" class="acento">chamando no WhatsApp?</span>
          </h1>

          <div class="chat" id="chat">
            <div class="msg cli" id="m1">Tem horário sábado?<small>21:14</small></div>
            <div class="msg bot" id="m2">Tenho 9h, 10h30 e 14h. Qual fica melhor pra você?<small>21:14</small></div>
            <div class="msg cli" id="m3">10h30<small>21:15</small></div>
            <div class="msg bot" id="m4">Fechado! Seu corte está marcado para sábado às 10h30.<span class="ok">✓</span><small>21:15</small></div>
          </div>
          <div class="digitando" id="dig1" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="digitando" id="dig2" aria-hidden="true"><i></i><i></i><i></i></div>
          <img class="mascote" id="mascote" src="assets/08-digitando.png" alt="guara.bot digitando a resposta" data-layout-allow-overflow />

          <div class="fecho" id="fecho">
            <div class="marca">guara<b>.bot</b></div>
            <p>Enquanto você corta,<br /><em>ele atende no WhatsApp.</em></p>
          </div>
          <img class="mascote-fim" id="mascoteFim" src="assets/05-confirmacao.png" alt="guara.bot com o polegar para cima" />
          <div class="assinatura" id="assinatura">
            <strong>nano<b>guará.ia</b></strong><span>Saiba mais na página</span>
          </div>
        </div>
      </section>
      <audio id="trilha" src=".media/audio/bgm/bgm_001.wav" data-start="0" data-duration="8" data-track-index="10" data-volume="0.9"></audio>
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const entra = { opacity: 0, y: 40, scale: .96, duration: .42, ease: 'back.out(1.6)' };
      const pisca = (sel, at) => tl.fromTo(sel + ' i', { opacity: .25 }, { opacity: 1, duration: .18, stagger: .09, repeat: 2, yoyo: true, ease: 'sine.inOut' }, at);


      // abertura
      tl.from('#selo', { opacity: 0, x: -60, duration: .5, ease: 'expo.out' }, 0)
        .from('#t1', { opacity: 0, x: 120, duration: .6, ease: 'expo.out' }, .1)
        .from('#t2', { opacity: 0, x: 140, duration: .6, ease: 'expo.out' }, .3);

      // conversa
      tl.from('#m1', { ...entra, transformOrigin: '0% 100%' }, .85)
        .from('#mascote', { opacity: 0, y: -40, scale: .85, duration: .7, ease: 'back.out(1.5)' }, 1.1)
        .to('#dig1', { opacity: 1, duration: .15 }, 1.4);
      pisca('#dig1', 1.4);
      tl.to('#dig1', { opacity: 0, duration: .12 }, 2.25)
        .from('#m2', { ...entra, transformOrigin: '100% 100%' }, 2.3)
        .from('#m3', { ...entra, transformOrigin: '0% 100%' }, 3.25)
        .to('#dig2', { opacity: 1, duration: .15 }, 3.6);
      pisca('#dig2', 3.6);
      tl.to('#dig2', { opacity: 0, duration: .12 }, 4.3)
        .from('#m4', { ...entra, transformOrigin: '100% 100%' }, 4.35)
        .from('#m4 .ok', { scale: 0, rotate: -30, duration: .4, ease: 'back.out(2.4)' }, 4.65);

      // fecho
      tl.to(['#chat', '#titulo', '#selo'], { opacity: 0, y: -60, duration: .45, ease: 'power2.in' }, 5.45)
        .to('#mascote', { opacity: 0, y: -60, duration: .4, ease: 'power2.in' }, 5.45)
        .fromTo('#fecho', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .6, ease: 'expo.out' }, 5.85)
        .fromTo('#mascoteFim', { opacity: 0, y: 120, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'back.out(1.4)' }, 6.0)
        .fromTo('#assinatura', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .45, ease: 'power2.out' }, 6.4)
        .to('#camera', { scale: 1.03, duration: 1.6, ease: 'power1.inOut' }, 6.4);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
