<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --forest: #2e7d32;
        --guarana: #d5382f;
        --cream: #fdf9f0;
        --graphite: #17231b;
        --white: #fffefa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--cream);
        font-family: Inter, sans-serif;
      }
      #root, .clip, .stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      .stage {
        isolation: isolate;
        color: var(--graphite);
        background:
          radial-gradient(circle at 76% 18%, rgba(255, 255, 255, .94) 0 13%, rgba(255, 255, 255, 0) 37%),
          linear-gradient(142deg, #fffdf7 0%, var(--cream) 44%, #eee3d1 100%);
        transform-origin: 50% 53%;
      }
      .texture {
        position: absolute;
        z-index: -3;
        inset: 0;
        opacity: .23;
        background-image: radial-gradient(circle, rgba(23, 35, 27, .18) 0 1px, transparent 1.35px);
        background-size: 18px 18px;
        mask-image: linear-gradient(to bottom, #000 0%, transparent 48%);
      }
      .frame {
        position: absolute;
        z-index: 20;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 14px rgba(255, 255, 255, .62);
      }
      .red-rail {
        position: absolute;
        z-index: -1;
        inset: 0 auto 0 0;
        width: 24px;
        background: var(--guarana);
      }
      .clinic-panel {
        position: absolute;
        z-index: -2;
        top: 250px;
        right: -94px;
        width: 520px;
        height: 880px;
        border: 2px solid rgba(46, 125, 50, .14);
        border-radius: 260px 0 0 260px;
        background:
          linear-gradient(90deg, rgba(46, 125, 50, .12), rgba(46, 125, 50, .03)),
          repeating-linear-gradient(90deg, rgba(46, 125, 50, .09) 0 3px, transparent 3px 52px);
      }
      .clinic-panel::before, .clinic-panel::after {
        content: "";
        position: absolute;
        border-radius: 999px;
      }
      .clinic-panel::before {
        top: 140px;
        left: 74px;
        width: 220px;
        height: 220px;
        border: 3px solid rgba(213, 56, 47, .16);
        box-shadow: 0 0 0 24px rgba(255, 255, 255, .28);
      }
      .clinic-panel::after {
        top: 530px;
        left: 186px;
        width: 12px;
        height: 210px;
        background: rgba(46, 125, 50, .19);
        box-shadow: -70px 46px 0 -2px rgba(46, 125, 50, .12), 70px -32px 0 -2px rgba(46, 125, 50, .12);
        transform: rotate(4deg);
      }
      .headline {
        position: absolute;
        z-index: 6;
        top: 74px;
        left: 82px;
        width: 900px;
        margin: 0;
        font-size: 98px;
        line-height: .91;
        letter-spacing: -5.8px;
        font-weight: 900;
        text-transform: uppercase;
      }
      .headline-top, .headline-accent { display: block; }
      .headline-accent {
        margin-top: 8px;
        color: var(--guarana);
      }
      .underline {
        position: absolute;
        left: 3px;
        bottom: -28px;
        width: 174px;
        height: 10px;
        border-radius: 20px;
        background: var(--forest);
        transform-origin: left center;
      }
      .mascot-wrap {
        position: absolute;
        z-index: 5;
        right: -36px;
        bottom: 72px;
        width: 790px;
        height: 790px;
      }
      .mascot-wrap::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 21%;
        bottom: 4%;
        width: 65%;
        height: 8%;
        border-radius: 50%;
        background: rgba(23, 35, 27, .20);
        filter: blur(23px);
        transform: scaleY(.46);
      }
      .mascot {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 24px 26px rgba(23, 35, 27, .14));
      }
      .orbit {
        position: absolute;
        z-index: 2;
        left: 49px;
        bottom: 214px;
        width: 650px;
        height: 278px;
        border: 3px dashed rgba(46, 125, 50, .24);
        border-radius: 50%;
        transform: rotate(4deg);
      }
      .proof {
        position: absolute;
        z-index: 10;
        left: 82px;
        bottom: 240px;
        display: flex;
        align-items: center;
        gap: 22px;
        width: 470px;
        min-height: 132px;
        padding: 22px 30px 22px 24px;
        border: 3px solid var(--forest);
        border-radius: 34px 34px 34px 9px;
        background: rgba(255, 254, 250, .96);
        box-shadow: 0 22px 50px rgba(23, 35, 27, .15);
        transform: rotate(-2deg);
      }
      .proof-icon {
        position: relative;
        flex: 0 0 76px;
        width: 76px;
        height: 76px;
        border-radius: 24px;
        background: var(--guarana);
        box-shadow: inset 0 0 0 7px rgba(255, 255, 255, .16);
      }
      .proof-icon::before {
        content: "";
        position: absolute;
        left: 21px;
        top: 18px;
        width: 31px;
        height: 18px;
        border-left: 8px solid var(--white);
        border-bottom: 8px solid var(--white);
        transform: rotate(-45deg);
      }
      .proof-text {
        font-size: 34px;
        line-height: 1.02;
        letter-spacing: -1.2px;
        font-weight: 850;
        color: var(--graphite);
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1350">
      <section id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="stage" id="camera" data-layout-allow-overflow>
          <div class="texture" aria-hidden="true"></div>
          <div class="red-rail" aria-hidden="true"></div>
          <div class="clinic-panel" data-layout-allow-overflow aria-hidden="true"></div>
          <h1 class="headline">
            <span class="headline-top">Seu consultório</span>
            <span class="headline-accent">atende 24h.</span>
            <i class="underline" aria-hidden="true"></i>
          </h1>
          <div class="orbit" aria-hidden="true"></div>
          <div class="proof" aria-label="Consulta agendada">
            <div class="proof-icon" aria-hidden="true"></div>
            <div class="proof-text">Consulta<br />agendada!</div>
          </div>
          <div class="mascot-wrap" data-layout-allow-overflow>
            <img class="mascot" src="assets/guara-bot-confirmacao.png" alt="guara.bot confirma que o agendamento foi concluído" />
          </div>
          <div class="frame" aria-hidden="true"></div>
        </div>
      </section>
      <audio id="soundtrack" src=".media/audio/bgm/bgm_001.wav" data-start="0" data-duration="8" data-track-index="10" data-volume="1"></audio>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.clinic-panel', { opacity: 0, x: 80, duration: 1.2, ease: 'power3.out' }, 0)
        .from('.headline-top', { opacity: 0, x: 110, duration: .72, ease: 'expo.out' }, .12)
        .from('.headline-accent', { opacity: 0, x: 140, duration: .72, ease: 'expo.out' }, .38)
        .from('.underline', { scaleX: 0, duration: .52, ease: 'power3.out' }, .88)
        .from('.mascot-wrap', { opacity: 0, x: 170, scale: .9, transformOrigin: '52% 58%', duration: 1.18, ease: 'power3.out' }, 1.14)
        .from('.orbit', { opacity: 0, scale: .78, transformOrigin: '50% 50%', duration: .95, ease: 'power2.out' }, 1.48)
        .from('.proof', { opacity: 0, x: -145, duration: .72, ease: 'expo.out' }, 3.18)
        .from('.proof-icon', { scale: 0, rotate: -18, transformOrigin: '50% 50%', duration: .48, ease: 'back.out(1.8)' }, 3.5)
        .to('#camera', { scale: 1.035, x: -14, y: -8, duration: 3.7, ease: 'power1.inOut' }, 4.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
