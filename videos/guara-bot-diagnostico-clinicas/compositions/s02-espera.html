            <div id="s02-tela">

              <div id="s02-alerta"></div>
            </div>
          </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s02-brilho1", { scale: 0.92 }, { scale: 1.06, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.fromTo("#s02-brilho2", { scale: 1.06, opacity: 0.7 }, { scale: 0.94, opacity: 1, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          // Entrada casada com a saída do gancho.
          tl.fromTo("#s02-palco", { y: 280, filter: "blur(18px)" }, { y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, 0);
          tl.fromTo("#s02-t1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);
          tl.fromTo("#s02-cel", { y: 200, opacity: 0, rotation: -3 }, { y: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "power3.out" }, 0.2);
          // Balões chegando, nenhum respondido.
          [["#s02-b1", 0.55], ["#s02-b2", 1.3], ["#s02-b3", 2.3]].forEach(function (b) {
            tl.fromTo(b[0], { scale: 0.75, opacity: 0, transformOrigin: "0% 100%" }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2)" }, b[1]);
          });
          tl.fromTo("#s02-t2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.65);
          // O último pesa: tela pisca em vermelho e o celular treme.
          tl.fromTo("#s02-alerta", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 2.38);
          tl.fromTo("#s02-cel", { x: 0 }, { x: 14, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3, immediateRender: false }, 2.4);
          tl.fromTo("#s02-b3", { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.1);
          // Saída em chicote para cima.
          tl.to("#s02-palco", { y: -280, filter: "blur(18px)", duration: 0.28, ease: "power2.in" }, 4.72);
          window.__timelines["s02"] = tl;
        })();
